[build-system]
requires = [
  "setuptools >= 61.0",
  "wheel",
  "setuptools_scm[toml]>=3.4",
  "build",
  "twine",

]
build-backend = "setuptools.build_meta"

[project]
name = "blond"
dynamic = ["version"]
description = "CERN code for simulating longitudinal beam dynamics in synchrotrons."
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
authors = [{ name = "Helga Timko", email = "helga.timko@cern.ch" }]
maintainers = [
  { name = "Alexandre Lasheen", email = "alexandre.lasheen@cern.ch" },
  { name = "Simon Albright", email = "simon.albright@cern.ch" },
  { name = "Simon Lauber", email = "simon.fabian.lauber@cern.ch" },
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "setuptools>=60",       # packaging utilities
  "numpy>=2",             # array computing
  "scipy>=1.15,!=1.18.0", # scientific computing algorithms
  "matplotlib>=3.9",      # plotting and visualization
  "numba>=0.61",          # simple computing backend that compiles everywhere out of the box
  "tqdm>4",               # nice loading bar
  "mpmath>=1",            # for numba fastmath replacement
  "sympy>=1.9",           # symbolic math for separatrix calculations, etc.
  "scikit-rf>1",          # pole fitting of impedances
]

[project.optional-dependencies]
dev = [
  "pytest>=9",           # test runner
  "pre-commit",          # automatic checks before `git commit`
  "pytest-cov>=6",       # test coverage reporting
  "mpmath>=1",           # part of the testing against blond2
  "pytest-randomly>=4",  # randomizes test order via `randomly-seed=...`
  "pytest-timeout>=2.4", # caps hung tests, e.g. deadlocked MPI collectives
  "nbconvert>=6",        # notebook execution in tests
]
doc = [
  "sphinx>=6",                   # documentation generator
  "sphinx-rtd-theme>=3",         # Read the Docs theme
  "numpydoc>1",                  # NumPy-style docstring parser
  "intersphinx_registry>0.2511", # cross-project documentation links
  "myst-parser>4",               # Markdown support for Sphinx
  "sphinx_autodoc_typehints>3",  # type hint integration for autodoc
  "pydata_sphinx_theme>0.16",    # PyData community theme
  "nbsphinx>=0.9",               # Jupyter notebook integration for Sphinx
  "nbconvert>=6",                # notebook to documentation conversion
  "ipython>5",                   # interactive Python shell
  "notebook>=7",                 # for jupyter-notebooks in the examples
  "sphinx-copybutton",           # for the copy button of code on the website
]
mpi = [
  # Distributed computing. Optional: the wheel needs an MPI runtime
  # (libmpi) on the system to import, which not every machine has, and
  # BLonD degrades to a single rank without it.
  "mpi4py>=4",
]
gpu_cuda12 = [
  "cupy-cuda12x!=14.0.0,!=14.2.0", # GPU array computing (CUDA 12)
]
gpu_cuda13 = [
  "cupy-cuda13x!=14.0.0,!=14.2.0", # GPU array computing (CUDA 13)
]
xsuite = [
  "xpart>=0.23.9, !=0.23.16", # particle objects
  "xobjects>=0.5.12",         # xsuite low-level objects
  "xtrack>=0.99.5",           # particle tracking
]
legacy = [
  "h5py>=3.11.0,<=3.15.1",      # HDF5 file format
  "matplotlib>=3.8.0,<=3.10.8", # plotting and visualization
  "mpmath>=1.0.0,<=1.3.0",      # arbitrary-precision arithmetic
  "numba>=0.61,<=0.63.1",       # JIT compiler
  "numpy>=2,<=2.2.6",           # array computing
  "scipy~=1.15",                # scientific computing algorithms
  "packaging==26.0",            # version parsing
]
all_no_cuda = ["blond[dev,doc,xsuite,mpi]"]
all_cuda12 = ["blond[dev,doc,xsuite,mpi,gpu_cuda12]"]
all_cuda13 = ["blond[dev,doc,xsuite,mpi,gpu_cuda13]"]

[tool.setuptools]
packages = { find = {} }
include-package-data = true

[project.urls]
Homepage = "https://blond.web.cern.ch/"
Documentation = "https://blond-code.docs.cern.ch/"
Repository = "https://gitlab.cern.ch/blond/BLonD"


[project.scripts]
blond-compile-cpp = "blond.core.backends.cpp.compile:main_cli"
blond-compile-cuda = "blond.core.backends.cuda.compile:main_cli"

[tool.setuptools_scm]
write_to = 'blond/_version.py' # autogenerates version string using git

[tool.ruff]
src = ["blond"]                                                       # Source directories
line-length = 79
target-version = "py310"                                              # Minimum supported version (no quotes)
fix = true                                                            # Enable autofix
exclude = ["blond/legacy/*", "legacy/*", "integrationtests_blond3/*"]
[tool.ruff.lint]
exclude = ["blond/experimental/*", "tests/*", "blond/examples/*"]
# Enable broad set of useful lint rules
select = [
  "E", # pycodestyle errors
  "F", # pyflakes
  "B", # flake8-bugbear (catch common bugs)
  # "I",  # isort (import sorting)
  # "N",  # pep8-naming
  "UP",  # pyupgrade
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
  "SIM", # flake8-simplify
  "NPY", # numpy-specific rules
  "PL",  # pylint rules
  "G",   # flake8-logging-format (no eager f-string log messages)
]

ignore = [
  "E501",    #  Line too long
  "E501",    #  Line too long
  "PLR0913", # Too many arguments in function definition
  "PLC0415", # `import` should be at the top-level of a file
  "D401",    # First line of docstring should be in imperative mood
  "B024",    # ... is an abstract base class, but it has no abstract methods or properties
  "E712",    #  Avoid equality comparisons to `False`; use `if not ...:` for false checks

]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
[tool.pytest.ini_options]
minversion = "8.4"
addopts = "--import-mode=importlib"
testpaths = ["tests/unittests", "tests/integration"]
markers = [
  "mpi: Tests that require MPI.",
  "backend_mutation: Tests that alter the backend as a side effect.",
  "cupy: Test that require CuPy.",
  "integration: Full end-to-end simulation tests.",
]

[tool.numpydoc_validation]
checks = [
  "all",  # report on all checks, except the below
  "SA01", # See Also section not found
  "EX01", # No examples section found
  "GL08", # The object does not have a docstring
  "ES01", # No extended summary found
  "PR04", # Parameter "..." has no type
  "PR04", # Parameter "..." has no type


]
exclude_files = [ # don't process filepaths that match these regex
  '^dev_tools/.*',
  '^docs/.*',
  '^integrationtests/.*',
  '^integrationtests_blond3/.*',
  '^legacy/.*',
  '^tests/.*',
  '^blond/legacy/.*',
  '^blond/core/backends/cpp/callables.py',
  '^blond/core/backends/cuda/callables.py',
  '^blond/core/backends/numba/callables.py',
  '^blond/experimental/.*',

]

[tool.vulture]
# Dead-code check, run by the `vulture` pre-commit hook. Vulture needs the
# whole tree to see every use, so the hook ignores the staged file list and
# scans these paths. Tests count as users.
paths = ["blond", "tests"]
exclude = [
  "*/blond/legacy/*",           # matched against absolute paths
  "*/blond/experimental/*",     # excluded from pre-commit by convention
  "*/tests/unittests/legacy/*",
]
min_confidence = 60 # unused attributes and methods are reported at 60 %
# Names vulture must treat as used, grouped by why. Matched by name
# only (any function, attribute or variable of that name), so keep them
# specific and drop an entry once the code it excuses is gone.
ignore_names = [
  # Called implicitly by Python
  "__getattr__", # module-level PEP 562 hooks (backend.py, cpp/callables.py)
  "exc_type",    # `__exit__` protocol arguments
  "exc_val",
  "exc_tb",
  # Public API or developer helpers without an internal caller
  "twopi",                                            # `backend.twopi`, documented backend constant
  "energy_lost_due_to_synchrotron_radiation_tracker", # public property
  "pinned_values_helper",                             # used by hand while writing pinned-value tests
  # Used only by blond/experimental, which vulture does not scan
  "populate_beam",
  "freeze_wakefields",
  "unfreeze_wakefields",
  "ExperimentalFeaturesWarning",
  # Used in ways vulture cannot see
  "_observe",     # Simulation: pinned so `on_run_simulation` can be found
  "_beams",       # Simulation: same; tests pin it too
  "profile_time", # solvers.py: `+=` updates the array in the deque in place
  # Required by an interface signature
  "obs_per_turn", # `on_run_simulation` keyword, accepted but not needed
  # Example scripts: values shown for demonstration
  "smoothness",           # EX_06 and line_density tests
  "recenter",
  "plot_result_blocking",
  "damping_time",
  "losses",
  "wakefield2",
  "extraction_energy",    # specifics/fccee/generate_rings.py, documents the mode
  # Tests: mocks, fixtures and objects found by introspection
  "n_turns_between_two_plots",
  "cavity_tracker",
  "OTFB_tracker",
  "phi_rf_effective",
  "energy_lost_per_turn",
  "maxiter",
  "_animation_pause",
  "_animation_fignumber",
  "cupy64_bit",
  "numpy64_bit",
  "share_of_circumference",
  "problem",
  "some_module",
  "weird",
  "programmed_cycle",
  "_example_densr_arr_rec",
  "dummy_value",
  "_time",
  "_beta",
  "_section_indices_to_observe",
  "sigma0",
  "U0",
  "common",
  "not_track",
  "not_found",
  "to_be_found",
  "_make_solver",
  "get_cake",
  "_numpy_backend",
  "simulate_BLonD3",
  "xpart",                       # import checks that xsuite is installed
  "tilt",
  "mock_rf_noise",
  "test_tuple",
  "rf_current_fine",
  "matching",
  "full_ring_and_rf_tracker",
  "save_profile_b2",
  "rf2",
  "mac_ind",
  "slic_ind",
  "b_ind",
  # Suspected dead code: remove in a follow-up, then drop the entry
  "gaussian_distribution",       # acc_math/analytic/simple_math.py, no caller
  "FloatOrArray",                # cycles/magnetic_cycle.py, type alias never used
  "_value_init",                 # MagneticCycle, written, never read
  "_base_magnetic_rigidity",     # MagneticCycle, written, never read
  "_base_values",                # MagneticCycle, "only for debugging"
  "_last_section_i_observed",    # observables.py, written, never read
  "_n_freq",                     # impedances/solvers.py, written, never read
  "_momentum_compaction_factor",
  "_wake_pot_vals_need_update",
  "_beam_feedback",              # RFStation, `attach_beam_feedback` stores it, never read
]
