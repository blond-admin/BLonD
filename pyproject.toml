[build-system]
requires = [
  "setuptools >= 61.0",
  "wheel",
  "setuptools_scm[toml]>=3.4",
  "build",
  "twine",

]
build-backend = "setuptools.build_meta"

[project]
name = "blond"
dynamic = ["dependencies", "optional-dependencies", "version"]
description = "CERN code for simulating longitudinal beam dynamics in synchrotrons."
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
authors = [{ name = "Helga Timko", email = "helga.timko@cern.ch" }]
maintainers = [
  { name = "Alexandre Lasheen", email = "alexandre.lasheen@cern.ch" },
  { name = "Simon Albright", email = "simon.albright@cern.ch" },
  { name = "Simon Lauber", email = "simon.fabian.lauber@cern.ch" },
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]

[tool.setuptools]
packages = { find = {} }
include-package-data = true

[project.urls]
Homepage = "https://blond.web.cern.ch/"
Documentation = "https://blond-code.docs.cern.ch/"
Repository = "https://gitlab.cern.ch/blond/BLonD"


[project.scripts]
blond-compile-cpp = "blond.core.backends.cpp.compile:main_cli"
blond-compile-cuda = "blond.core.backends.cuda.compile:main_cli"

[tool.setuptools_scm]
write_to = 'blond/_version.py' # autogenerates version string using git

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies = { all_no_cuda = { file = [
  "requirements.txt",
  "requirements-dev.txt",
  "requirements-doc.txt",
  "blond/interfaces/xsuite/requirements.txt",
  "requirements-mpi.txt",
] }, all_cuda12 = { file = [
  "requirements.txt",
  "requirements-gpu-cuda12.txt",
  "requirements-dev.txt",
  "requirements-doc.txt",
  "blond/interfaces/xsuite/requirements.txt",
  "requirements-mpi.txt",
] }, all_cuda13 = { file = [
  "requirements.txt",
  "requirements-gpu-cuda13.txt",
  "requirements-dev.txt",
  "requirements-doc.txt",
  "blond/interfaces/xsuite/requirements.txt",
  "requirements-mpi.txt",
] }, gpu_cuda12 = { file = [
  "requirements-gpu-cuda12.txt",
] }, gpu_cuda13 = { file = [
  "requirements-gpu-cuda13.txt",
] }, dev = { file = [
  "requirements-dev.txt",
] }, mpi = { file = [
  "requirements-mpi.txt",
] }, legacy = { file = [
  "legacy/requirements.txt",
] }, doc = { file = "requirements-doc.txt" }, xsuite = { file = "blond/interfaces/xsuite/requirements.txt" } }

[tool.ty.src]
include = ["blond"]
exclude = ["blond/legacy"]

[[tool.ty.overrides]]
# Backend implementation files do deliberate low-level type coercion
# (floattype casts, ctypes, numba JIT, cuda kernels) that ty cannot model:
#   - invalid-method-override: concrete signatures use `float` where the base
#     Specials class accepts `float | np.floating[Any]` — intentional narrowing
#   - invalid-assignment / invalid-return-type: `floattype(x)` re-assigns a
#     float-typed local to a numpy scalar, valid at runtime
#   - invalid-argument-type: ctypes wrappers receive numpy integer scalars
#   - not-iterable: numba's `prange` is a valid `range` drop-in inside @njit
include = [
  "blond/core/backends/cpp/callables.py",
  "blond/core/backends/cuda/callables.py",
  "blond/core/backends/numba/callables.py",
  "blond/core/backends/python/callables.py",
  "blond/core/backends/mpi_distributed/callables.py",
]
rules = { invalid-method-override = "ignore", invalid-assignment = "ignore", invalid-return-type = "ignore", invalid-argument-type = "ignore", not-iterable = "ignore" }

[tool.ruff]
src = ["blond"]                                                       # Source directories
line-length = 79
target-version = "py310"                                              # Minimum supported version (no quotes)
fix = true                                                            # Enable autofix
exclude = ["blond/legacy/*", "legacy/*", "integrationtests_blond3/*"]
[tool.ruff.lint]
exclude = ["blond/experimental/*", "unittests/*", "blond/examples/*"]
# Enable broad set of useful lint rules
select = [
  "E", # pycodestyle errors
  "F", # pyflakes
  "B", # flake8-bugbear (catch common bugs)
  # "I",  # isort (import sorting)
  # "N",  # pep8-naming
  "UP",  # pyupgrade
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
  "SIM", # flake8-simplify
  "NPY", # numpy-specific rules
  "PL",  # pylint rules
]

ignore = [
  "E501",    #  Line too long
  "E501",    #  Line too long
  "PLR0913", # Too many arguments in function definition
  "PLC0415", # `import` should be at the top-level of a file
  "D401",    # First line of docstring should be in imperative mood
  "B024",    # ... is an abstract base class, but it has no abstract methods or properties
  "E712",    #  Avoid equality comparisons to `False`; use `if not ...:` for false checks

]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
[tool.pytest.ini_options]
minversion = "8.4"
addopts = "--import-mode=importlib"
markers = [
  "mpi: Tests that require MPI.",
  "backend_mutation: Tests that alter the backend as a side effect.",
  "cupy: Test that require CuPy.",
]

[tool.numpydoc_validation]
checks = [
  "all",  # report on all checks, except the below
  "SA01", # See Also section not found
  "EX01", # No examples section found
  "GL08", # The object does not have a docstring
  "ES01", # No extended summary found
  "PR04", # Parameter "..." has no type
  "PR04", # Parameter "..." has no type


]
exclude_files = [ # don't process filepaths that match these regex
  '^dev_tools/.*',
  '^docs/.*',
  '^integrationtests/.*',
  '^integrationtests_blond3/.*',
  '^legacy/.*',
  '^unittests/.*',
  '^blond/legacy/.*',
  '^blond/core/backends/cpp/callables.py',
  '^blond/core/backends/cuda/callables.py',
  '^blond/core/backends/numba/callables.py',
  '^blond/experimental/.*',

]
