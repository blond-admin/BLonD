exclude: ^(legacy|blond/legacy/|builds)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace  # Trims trailing whitespace.
      - id: end-of-file-fixer  # Makes sure files end in a newline and only a newline.
      - id: check-yaml  # Attempts to load all yaml files to verify syntax.
      - id: check-json  # Attempts to load all yaml files to verify syntax.
      - id: check-merge-conflict  # Check for files that contain merge conflict strings.
      - id: check-added-large-files  # Prevent giant files from being committed.
        args: [ '--maxkb=5000' ]
      - id: no-commit-to-branch # not allowing to directly commit to blonder branch
        args: [--branch, blonder, --branch, develop, --branch, master]

  # Sorts the python import statements
  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length", "79"] # otherwise not compatible with Ruf

  # keep python syntax up-to-date
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py310-plus]

  # https://pre-commit.com/
  # use `ruff check` to debug this hook
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15  # Replace with the latest version
    hooks:
      - id: ruff-format  # This runs `ruff format`
      - id: ruff-check  # This runs `ruff check`
        args: ["--fix"] # otherwise not compatible with Ruff

  # Formats the C/C++ and CUDA backends (style in .clang-format).
  # clang-format comes from a pinned PyPI wheel inside pre-commit's own
  # environment, so no system clang is needed and every OS gets the same
  # version. The hook only runs when C/C++/CUDA files are staged.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.1
    hooks:
      - id: clang-format
        types_or: [c, c++, cuda]
        # verbatim copy of an external project, keep it diffable upstream
        exclude: ^blond/interfaces/rf_noise_cpp/varigen\.h$

  # Check that the copyright notice is there
  - repo: local
    hooks:
      - id: custom-py-check
        name: check copyright
        entry: python dev_tools/precommit_check_copyright.py
        language: system

  # ruff's missing-docstring rules (D1xx) skip everything inside a
  # `_private` folder or file. This reruns them as if the path had no
  # underscores, so making a folder private does not lose the check.
  # Same file scope as ruff's `lint.exclude`; keep the ruff pin in sync.
  - repo: local
    hooks:
      - id: check-docstrings-in-private-paths
        name: check docstrings in private folders and files
        entry: python dev_tools/precommit_check_docstrings.py
        language: python
        additional_dependencies: ["ruff==0.15.15"]
        types: [python]
        files: ^blond/
        exclude: ^blond/(experimental|examples)/

  # `blond/__init__.py` is a one-way door: it re-exports the public API
  # for users, and package code must not import back through it. Doing so
  # makes the facade a cycle -- importing the package runs `__init__.py`,
  # which imports the module, which asks `__init__.py` back for a name it
  # may not have bound yet -- which in turn makes the order of the
  # re-exports load-bearing for unrelated modules. Internal code imports
  # from the module that defines the name.
  - repo: local
    hooks:
      - id: no-facade-imports
        name: internal code must not import from the blond facade
        language: pygrep
        # Matches `from blond import X` but not `from blond.x import X`,
        # since the literal " import" must follow "blond" directly.
        entry: '^\s*(from blond import|import blond\s*$)'
        types: [python]
        files: ^blond/
        # `examples` is user-facing and should demonstrate the public
        # API; `legacy` is BLonD 2, excluded by repo convention.
        exclude: ^blond/(examples|legacy)/

  # `blond/experimental/__init__.py` warns on import, to mark its contents
  # as liable to change. That warning only means something if reaching for
  # experimental code is what triggers it, so stable code must not import
  # `blond.experimental` at module level -- otherwise a plain
  # `import blond` warns every user about features they never asked for.
  # Only column-zero imports are matched: an indented one inside a
  # `TYPE_CHECKING` block or a function body does not run on import.
  - repo: local
    hooks:
      - id: no-experimental-imports
        name: stable code must not import blond.experimental on import
        language: pygrep
        entry: '^(from|import) blond\.experimental'
        types: [python]
        files: ^blond/
        exclude: ^blond/(experimental|examples|legacy)/

  # Every class exported at BLonD toplevel needs a documentation category
  - repo: local
    hooks:
      - id: check-toplevel-categories
        name: check toplevel classes are categorized for the docs
        entry: python dev_tools/precommit_check_toplevel_categories.py
        language: system
        # Only the toplevel exports and the category mapping itself can
        # break this; the doc build would otherwise be the first to notice.
        files: ^(blond/__init__\.py|docs/create_doc_blond_main_objects\.py)$
        pass_filenames: false

  # Mirror .agents/skills into root CLAUDE.md / AGENTS.md and .claude/skills
  - repo: local
    hooks:
      - id: sync-agent-docs
        name: sync CLAUDE.md / AGENTS.md and .claude/skills from .agents/skills
        entry: python dev_tools/sync_agent_docs.py
        language: system
        # Run when any skill source changes: .agents/skills is the single
        # source the mirrors are generated from, so there is nothing to
        # regenerate on any other commit. The hook rewrites CLAUDE.md /
        # AGENTS.md and .claude/skills (not in this filter) and fails if they
        # changed, so they get re-staged.
        files: ^\.agents/skills/
        pass_filenames: false

  # https://numpydoc.readthedocs.io/en/latest/validation.html
  # use `numpydoc lint --help` to debug this hook
  - repo: https://github.com/numpy/numpydoc
    rev: v1.10.0
    hooks:
      - id: numpydoc-validation

  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-ruff-format
        files: \.ipynb$  # Only apply to .ipynb files

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
