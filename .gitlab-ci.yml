variables:
  project_name: BLonD
  # Set the project root to the directory containing your setup.py
  project_root: ./
  PYPI_UPLOAD_URL: "https://upload.pypi.org/legacy/"
  # --- uv (package installer, replaces pip; see `.cache_uv`) ---
  # uv keeps a content-addressed store of every downloaded/built wheel and
  # of the index metadata. Point it into the project dir so GitLab can cache
  # it between pipelines: a warm cache turns the ~6 minute fresh
  # `pip install .[all_cuda12]` into a few seconds of hard-linking. There is
  # deliberately NO lockfile (uv.lock is git-ignored): every pipeline creates
  # a fresh venv and re-resolves against the index, so we always test the
  # newest releases and notice breakage early. Only the wheel *files* are
  # reused from the cache, not a pinned set of versions.
  UV_CACHE_DIR: "${CI_PROJECT_DIR}/.uv_cache"
  # Always use the interpreter shipped in the CI image, never let uv download
  # a managed Python of its own.
  UV_PYTHON_DOWNLOADS: "never"
  # --- numba JIT cache (persisted across pipelines, see `.cache_numba`) ---
  # Centralise numba's on-disk cache (.nbi/.nbc) into one dir so GitLab can
  # cache it between runs; the kernels already use `cache=True`, but the
  # cache is otherwise cold on every fresh runner and recompiles during the
  # test run (the dominant cost).
  NUMBA_CACHE_DIR: "${CI_PROJECT_DIR}/.numba_cache"
  # Compile CPU-generic code so a cached entry is valid on ANY runner,
  # independent of its CPU. numba self-validates entries, so a mismatch only
  # ever forces a recompile (never wrong code); `generic` just maximises the
  # cross-runner hit rate. Remove these two if the runner pool is
  # CPU-homogeneous and you prefer full `-march=native` kernel speed.
  NUMBA_CPU_NAME: "generic"
  NUMBA_CPU_FEATURES: ""
stages:
  - precommit
  - doc_build
  - test_without_gpu
  - test_py314
  - test
  - deploy
default:
  interruptible: true

# Automatically cancel older running
# pipelines when a new one starts on the same branch
workflow:
  rules:
    - when: always
  auto_cancel:
    on_new_commit: interruptible

# ---------------------------------------------------------------------------
# Installing uv
# ---------------------------------------------------------------------------
# The CI images run as `non_root`, so `pip install uv` lands in
# ~/.local/bin, which is not on PATH -- hence the export. uv is installed
# with the *system* pip before any venv exists; the venv itself is then
# created by uv and contains no pip at all (use `uv pip ...` inside it).
# `.uv_setup` is a YAML anchor (not an `extends` template) so the same
# lines can be spliced into several before_scripts / after_scripts.
.uv_setup: &uv_setup
  - python3 -m pip install --user --quiet uv
  - export PATH="${HOME}/.local/bin:${PATH}"
  - uv --version

# ---------------------------------------------------------------------------
# Caches
# ---------------------------------------------------------------------------
# NOTE: GitLab `extends` merges hashes but OVERWRITES arrays, so two
# templates that each define `cache:` (or `after_script:`) do not add up --
# the last one listed in `extends` wins. Every cache a job needs therefore
# has to be listed in ONE template. `.cache_uv` is for the pure-install
# jobs (docs, pre-commit); `.cache_test` bundles uv + numba + compiled
# backends for the test jobs.

.cache_uv:
  # Persist uv's download/build cache between pipelines. The key is per-job:
  # the cache is content-addressed, so sharing it would be *safe*, but
  # concurrent jobs uploading the same key overwrite each other and the
  # wheels differ per Python version anyway.
  cache:
    - key: "uv-${CI_JOB_NAME}"
      paths:
        - .uv_cache/
  after_script:
    # after_script runs in a fresh shell: PATH and the venv are gone, so
    # re-add uv. `uv cache prune` drops entries no longer reachable by the
    # current cache layout. Because every pipeline installs the newest
    # releases, superseded wheels still accumulate slowly; wipe the cache
    # once it outgrows BLOND_UV_CACHE_MAX_MB (default 3000) so the GitLab
    # cache archive stays bounded. after_script runs just before the cache
    # upload.
    - export PATH="${HOME}/.local/bin:${PATH}"
    - uv cache prune || true
    - >
      size_mb=$(du -sm "${UV_CACHE_DIR}" 2>/dev/null | cut -f1 || echo 0);
      max_mb="${BLOND_UV_CACHE_MAX_MB:-3000}";
      echo "uv cache size: ${size_mb} MB (max ${max_mb} MB)";
      if [ "${size_mb}" -gt "${max_mb}" ]; then
        echo "uv cache exceeds ${max_mb} MB, wiping it";
        uv cache clean;
      fi

.cache_test:
  cache:
    # uv download/build cache, see `.cache_uv`.
    - key: "uv-${CI_JOB_NAME}"
      paths:
        - .uv_cache/
    # Persist numba's JIT cache between pipelines. The key is per-job, which
    # also separates Python versions (different image -> different
    # numba/python -> entries would not validate anyway). Safe to share
    # across GPU and non-GPU runners: it holds only CPU kernel code and
    # self-validates on load.
    - key: "numba-${CI_JOB_NAME}"
      paths:
        - .numba_cache/
    # Persist the compiled C++/CUDA backends between pipelines. Each
    # compiled/<hash>/ directory is keyed (see compiled_dir_handler) on the
    # toolchain version, host CPU instruction set and build flags, so a
    # binary is only ever reused in an identical environment. The compile
    # steps run with --limit-cachesize, which prunes least-recently-used
    # siblings to cap how many accumulate. The cache key is per-job, which
    # keeps Python-version images separate; a job that runs on runners with
    # different CPUs simply accumulates one directory per CPU (bounded by
    # BLOND_COMPILED_CACHE_KEEP_N).
    - key: "compiled-${CI_JOB_NAME}"
      paths:
        - blond/core/backends/cpp/compiled/
        - blond/core/backends/cuda/compiled/
  after_script:
    # Bound the numba cache size before GitLab uploads it. Bare python3 +
    # pure stdlib: no venv needed, and no `import blond` -- which would
    # recompile kernels into the very cache we are pruning. Size budget:
    # BLOND_NUMBA_CACHE_MAX_MB (default 500).
    - python3 dev_tools/prune_numba_cache.py
    # Same bookkeeping for the uv cache as in `.cache_uv` (kept in sync by
    # hand -- see the NOTE above on why it cannot be inherited).
    - export PATH="${HOME}/.local/bin:${PATH}"
    - uv cache prune || true
    - >
      size_mb=$(du -sm "${UV_CACHE_DIR}" 2>/dev/null | cut -f1 || echo 0);
      max_mb="${BLOND_UV_CACHE_MAX_MB:-3000}";
      echo "uv cache size: ${size_mb} MB (max ${max_mb} MB)";
      if [ "${size_mb}" -gt "${max_mb}" ]; then
        echo "uv cache exceeds ${max_mb} MB, wiping it";
        uv cache clean;
      fi

.on_tag:
  # Rules to run a job only on a git tagged commit
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success

.before:
  before_script:
    # Size the thread pools from the runner's real CPU entitlement.
    # libgomp (and numba) see the *host* core count, not the cgroup quota
    # this job runs under, so they would start one worker per host core and
    # then have them all contend for a handful of entitled CPUs at every
    # barrier. See dev_tools/ci_omp_threads.py.
    - export OMP_NUM_THREADS=$(python3 dev_tools/ci_omp_threads.py)
    - export NUMBA_NUM_THREADS=$OMP_NUM_THREADS
    - echo "OMP_NUM_THREADS=$OMP_NUM_THREADS (host nproc=$(nproc))"
    # Verify CUDA installation
    - nvidia-smi
    - gcc --version
    - nvcc --version # probe NVCC installation
    - python3 --version && gcc --version && mpirun --version
    # Install uv, then let it create and populate the virtual environment.
    - *uv_setup
    - uv venv ./.venv
    - source ./.venv/bin/activate  # For Linux/macOS, use `source venv/bin/activate`
    # Install project with extras. Fresh resolution every pipeline (newest
    # releases); only the wheel files come from the persisted uv cache.
    - uv pip install -e ${project_root}[all_cuda12]
    - cd ${project_root}
    # Compile C++, CUDA backends. --limit-cachesize evicts least-recently-used
    # sibling builds so the cached compiled/ tree stays bounded (CI-only; local
    # builds keep all of them).
    - python3 blond/core/backends/cpp/compile.py --limit-cachesize
    - python3 blond/core/backends/cuda/compile.py --limit-cachesize

.before_no_gpu:
  before_script:
    # Size the thread pools from the runner's real CPU entitlement.
    # libgomp (and numba) see the *host* core count, not the cgroup quota
    # this job runs under, so they would start one worker per host core and
    # then have them all contend for a handful of entitled CPUs at every
    # barrier. See dev_tools/ci_omp_threads.py.
    - export OMP_NUM_THREADS=$(python3 dev_tools/ci_omp_threads.py)
    - export NUMBA_NUM_THREADS=$OMP_NUM_THREADS
    - echo "OMP_NUM_THREADS=$OMP_NUM_THREADS (host nproc=$(nproc))"
    # Verify installation
    - gcc --version
    - python3 --version && gcc --version && mpirun --version
    # Install uv, then let it create and populate the virtual environment.
    - *uv_setup
    - uv venv ./.venv
    - source ./.venv/bin/activate  # For Linux/macOS, use `source venv/bin/activate`
    # Install project with extras (see `.before`).
    - uv pip install -e ${project_root}[all_no_cuda]
    - cd ${project_root}
    # Compile C++ backend. --limit-cachesize evicts least-recently-used sibling
    # builds so the cached compiled/ tree stays bounded (CI-only).
    - python3 blond/core/backends/cpp/compile.py --limit-cachesize

.main:
  variables:
    BLOND_BACKEND_MODE: "numba"     # Set the basic backend to numba. It is most verbose about wrong types
    BLOND_FORCE_TEST_ALL_BACKENDS: "True"     # Force backend scanning unittests to use all available backends
    MPLBACKEND: "Agg"     # Set the matplotlib backend to non-interactive. Test should run faster and MPI-test is not deadlocked.
  script:
    - export PATH="${HOME}/.local/bin:${PATH}"  # uv (script runs in a new shell)
    - source ./.venv/bin/activate  # For Linux/macOS, use `source venv/bin/activate`
    - uv pip list
    - cd ${project_root}
    # Warm the numba JIT cache in a single process before mpirun spawns 2
    # concurrent ranks. NUMBA_CACHE_DIR is shared by both ranks; if it is
    # cold, both processes race to compile and write the same cache
    # entries concurrently, and the loser can be left with a corrupted or
    # partial entry -- causing an unrelated numba-backed call to raise on
    # just that rank, which then deadlocks the other rank's next MPI
    # collective. Compiling once, single-process, first (mirroring the cpp
    # /cuda compile steps in `.before`) avoids the race.
    - python3 -m pytest -v -m "not mpi" tests/unittests/core/backends/test_backend.py
    # Run only MPI unittests. Only the main thread should report.
    # `-p no:randomly`: both ranks MUST run tests in identical order. Random
    # ordering can desync the ranks (one rank enters a collective while the
    # other does not), deadlocking on the unmatched MPI call. A fixed seed is
    # not enough: --cov on rank 0 alone perturbs the shuffle between ranks.
    # `-x --timeout=300 --timeout-method=thread`: a rank that fails where the
    # others do not is left out of step on every following collective, so the
    # run hangs until the job's 2h wall clock kills it -- and the tracebacks
    # are never printed. The timeout turns such a hang into a stack dump on
    # the stuck rank, and `-x` stops the run at the first failure instead of
    # paying the timeout again for every remaining test. The cap is per
    # test, not per session: 300s leaves ~40x headroom over the slowest MPI
    # test measured locally (6.8s), while still turning a deadlock into a
    # 5 minute failure instead of a 2h one.
    - mpirun -n 2 bash -c 'export OMP_NUM_THREADS=$(python3 dev_tools/ci_omp_threads.py --divide 2); export NUMBA_NUM_THREADS=$OMP_NUM_THREADS; if [ "$OMPI_COMM_WORLD_RANK" = "0" ]; then python3 -m pytest -v -m "mpi" -p no:randomly -x --timeout=300 --timeout-method=thread --cov --cov-config=.coveragerc; else python3 -m pytest -v -m "mpi" -p no:randomly -x --timeout=300 --timeout-method=thread; fi'
    # Run all unittests + the examples
    - uv pip uninstall mpi4py
    - python3 -m pytest
      -v
      --randomly-seed=$CI_PIPELINE_ID
      --cov-append
      --cov
      --cov-config=.coveragerc
      --cov-report html:coverage-html
      --cov-report xml:coverage.xml
      --junitxml=junit-report.xml
    - COV=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); rate = float(tree.getroot().attrib['line-rate']) * 100; print(rate)")
    - echo "XML_COVERAGE=$COV"
  # coverage: '/XML_COVERAGE=(\d+\.\d+)/'


.main_only_cupy:
  variables:
    BLOND_BACKEND_MODE: "cuda"     # Set the basic backend to CUDA.
    BLOND_FORCE_TEST_ALL_BACKENDS: "False"     # Force backend scanning unittests to use all available backends
    MPLBACKEND: "Agg"     # Set the matplotlib backend to non-interactive. Test should run faster and MPI-test is not deadlocked.
  script:
    - export PATH="${HOME}/.local/bin:${PATH}"  # uv (script runs in a new shell)
    - source ./.venv/bin/activate  # For Linux/macOS, use `source venv/bin/activate`
    - uv pip list
    - cd ${project_root}
    - python3 -m pytest
      -m "not backend_mutation and not mpi"
      -m "not backend_mutation"
      -v
      --randomly-seed=$CI_PIPELINE_ID

.main_no_gpu:
  variables:
    BLOND_BACKEND_MODE: "cpp"     # Set the basic backend to numba. It is most verbose about wrong types
    BLOND_FORCE_TEST_ALL_BACKENDS: "False"     # Force backend scanning unittests to use all available backends
    MPLBACKEND: "Agg"     # Set the matplotlib backend to non-interactive. Test should run faster and MPI-test is not deadlocked.
  script:
    - export PATH="${HOME}/.local/bin:${PATH}"  # uv (script runs in a new shell)
    - source ./.venv/bin/activate  # For Linux/macOS, use `source venv/bin/activate`
    - uv pip list
    - cd ${project_root}
    # Run only MPI unittests. Only the main thread should report.
    # `-p no:randomly`: both ranks MUST run tests in identical order, otherwise
    # they can desync on an MPI collective and deadlock (see .main for details).
    # See the `-x --timeout=...` rationale in the `test_py_314` job above.
    - mpirun -n 2 bash -c 'export OMP_NUM_THREADS=$(python3 dev_tools/ci_omp_threads.py --divide 2); export NUMBA_NUM_THREADS=$OMP_NUM_THREADS; if [ "$OMPI_COMM_WORLD_RANK" = "0" ]; then python3 -m pytest -v -m "mpi" -p no:randomly -x --timeout=300 --timeout-method=thread; else python3 -m pytest -v -m "mpi" -p no:randomly -x --timeout=300 --timeout-method=thread; fi'
    # Run all unittests + the examples
    - uv pip uninstall mpi4py
    # cupy is not part of all_no_cuda; uninstalling a missing package is a
    # no-op for uv, kept so the job stays identical if the extras change.
    - uv pip uninstall cupy-cuda12x
    - python3 -m pytest
      -v
      --randomly-seed=$CI_PIPELINE_ID

.main_many_environments:
  variables:
    BLOND_BACKEND_MODE: "numba"     # Set the basic backend to numba. It is most verbose about wrong types
    BLOND_FORCE_TEST_ALL_BACKENDS: "True"     # Force backend scanning unittests to use all available backends
    MPLBACKEND: "Agg"     # Set the matplotlib backend to non-interactive. Test should run faster and MPI-test is not deadlocked.
  script:
    - export PATH="${HOME}/.local/bin:${PATH}"  # uv (script runs in a new shell)
    - source ./.venv/bin/activate  # For Linux/macOS, use `source venv/bin/activate`
    - uv pip list
    - cd ${project_root}
    - mkdir -p junit-reports
    # Warm the numba JIT cache in a single process before mpirun spawns 2
    # concurrent ranks. NUMBA_CACHE_DIR is shared by both ranks; if it is
    # cold, both processes race to compile and write the same cache
    # entries concurrently, and the loser can be left with a corrupted or
    # partial entry -- causing an unrelated numba-backed call to raise on
    # just that rank, which then deadlocks the other rank's next MPI
    # collective. Compiling once, single-process, first (mirroring the cpp
    # /cuda compile steps in `.before`) avoids the race.
    - python3 -m pytest -v -m "not mpi" tests/unittests/core/backends/test_backend.py
    # Run only MPI unittests. Only the main thread should report.
    # `-p no:randomly`: both ranks MUST run tests in identical order. Random
    # ordering can desync the ranks (one rank enters a collective while the
    # other does not), deadlocking on the unmatched MPI call. A fixed seed is
    # not enough: --cov on rank 0 alone perturbs the shuffle between ranks.
    # `-x --timeout=300 --timeout-method=thread`: a rank that fails where the
    # others do not is left out of step on every following collective, so the
    # run hangs until the job's 2h wall clock kills it -- and the tracebacks
    # are never printed. The timeout turns such a hang into a stack dump on
    # the stuck rank, and `-x` stops the run at the first failure instead of
    # paying the timeout again for every remaining test. The cap is per
    # test, not per session: 300s leaves ~40x headroom over the slowest MPI
    # test measured locally (6.8s), while still turning a deadlock into a
    # 5 minute failure instead of a 2h one.
    - mpirun -n 2 bash -c 'export OMP_NUM_THREADS=$(python3 dev_tools/ci_omp_threads.py --divide 2); export NUMBA_NUM_THREADS=$OMP_NUM_THREADS; if [ "$OMPI_COMM_WORLD_RANK" = "0" ]; then python3 -m pytest -v -m "mpi" -p no:randomly -x --timeout=300 --timeout-method=thread --cov --cov-config=.coveragerc; else python3 -m pytest -v -m "mpi" -p no:randomly -x --timeout=300 --timeout-method=thread; fi'
    # Run all unittests + the examples
    - uv pip uninstall mpi4py
    - python3 -m pytest
      -v
      --cov-append
      --cov
      --cov-config=.coveragerc
      --junitxml=junit-reports/junit-report-numba.xml
    - export BLOND_BACKEND_MODE="cuda"
    - python3 -m pytest
      -v
      -m "not mpi and not backend_mutation"
      --cov-append
      --cov
      --cov-config=.coveragerc
      --junitxml=junit-reports/junit-report-cuda.xml
    - export BLOND_BACKEND_MODE="numba"
    - uv pip uninstall cupy-cuda12x
    - export BLOND_FORCE_TEST_ALL_BACKENDS="False"
    - python3 -m pytest
      -v
      --randomly-seed=$CI_PIPELINE_ID
      --cov-append
      --cov
      --cov-config=.coveragerc
      --cov-report html:coverage-html
      --cov-report xml:coverage.xml
      --junitxml=junit-reports/junit-report-numba-without-cuda.xml
    - COV=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); rate = float(tree.getroot().attrib['line-rate']) * 100; print(rate)")
    - echo "XML_COVERAGE=$COV"
  coverage: '/XML_COVERAGE=(\d+\.\d+)/'


.publish:
  artifacts:
    expire_in: 30 days
    reports:
      # Enables https://docs.gitlab.com/ee/user/project/merge_requests/test_coverage_visualization.html
      coverage_report:
        coverage_format: cobertura
        path: ${project_root}coverage.xml
      # Enables https://docs.gitlab.com/ee/ci/unit_test_reports.html
      junit: ${project_root}junit-reports/junit-report-*.xml
    paths:
      - ${project_root}coverage-html/*
      - ${project_root}coverage.xml
      - ${project_root}junit-reports/junit-report-*.xml
    # reports:
    #   junit: ${project_root}/coverage-report.xml

precommit-check:

  image: python:3.14 # See https://gitlab.cern.ch/blond/developer-tools/gitlab-ci-docker
  stage: precommit
  interruptible: true
  extends:
    - .cache_uv
  variables:
    SKIP: no-commit-to-branch
    # pre-commit builds one virtualenv per hook. Point its store into the
    # project dir so the `cache:` entry below actually captures it (the
    # default is ~/.cache/pre-commit, which GitLab cannot cache).
    PRE_COMMIT_HOME: "${CI_PROJECT_DIR}/.cache/pre-commit"
  before_script:
    - *uv_setup
    - uv venv ./.venv
    - source ./.venv/bin/activate
    - uv pip install pre-commit
  script:
    - pre-commit run --all-files
  cache:
    - key: "uv-${CI_JOB_NAME}"
      paths:
        - .uv_cache/
    - key: pre-commit-cache
      paths:
        - .cache/pre-commit

test_py_314_no_cupy:
  image: gitlab-registry.cern.ch/blond/blond/python314
  stage: test_without_gpu
  interruptible: true
  extends:
    - .before_no_gpu
    - .main_no_gpu
    - .cache_test
  dependencies: []

test_py_314_main_many_environments:
  image: gitlab-registry.cern.ch/blond/blond/python314
  stage: test_py314
  interruptible: true
  extends:
    - .before
    - .main_many_environments
    - .publish
    - .cache_test
  dependencies: []
  tags:
    - k8s-gpu

test_py_310:
  image: gitlab-registry.cern.ch/blond/blond/python310
  stage: test
  interruptible: true
  extends:
    - .before
    - .main
    - .cache_test
    # - .publish
  dependencies: []
  tags:
    - k8s-gpu
  rules:
    # Run on branch blonder
    - if: '$CI_COMMIT_BRANCH == "blonder"'

    # ALSO run in merge requests targeting blonder
