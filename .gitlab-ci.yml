test_minimum:
  image: gitlab-registry.cern.ch/blond/blond/python310
  stage: test
  interruptible: true
  extends:
    - .cache_test
  dependencies: []
  variables:
    BLOND_BACKEND_MODE: "numba"     # Set the basic backend to numba. It is most verbose about wrong types

  # Replaces .before: same uv setup, but resolve the OLDEST allowed version
  # of every direct dependency to check the lower bounds in pyproject.toml.
  before_script:
    # Size the thread pools from the runner's real CPU entitlement.
    # libgomp (and numba) see the *host* core count, not the cgroup quota
    # this job runs under, so they would start one worker per host core and
    # then have them all contend for a handful of entitled CPUs at every
    # barrier. See dev_tools/ci_omp_threads.py.
    - export OMP_NUM_THREADS=$(python3 dev_tools/ci_omp_threads.py)
    - export NUMBA_NUM_THREADS=$OMP_NUM_THREADS
    - echo "OMP_NUM_THREADS=$OMP_NUM_THREADS (host nproc=$(nproc))"
    # Create venv to avoid permission error when installing packages
    - *uv_setup
    - uv venv ./.venv
    - source ./.venv/bin/activate
    - uv pip install --resolution lowest-direct ${project_root}[all_cuda12]
    - cd ${project_root}
    # Compile C++, CUDA, Fortran backends. --limit-cachesize evicts
    # least-recently-used sibling builds so the cached compiled/ tree stays
    # bounded (CI-only).
    - python blond/core/backends/cpp/compile.py --limit-cachesize
    - python blond/core/backends/cuda/compile.py --limit-cachesize

  # Replace .main to use python from venv not python3 from system
  script:
    - export PATH="${HOME}/.local/bin:${PATH}"  # uv (script runs in a new shell)
    - source ./.venv/bin/activate
    - uv pip list
    - cd ${project_root}
    # Run all unittests + the examples
    - python -m pytest
      -v
      --import-mode=importlib
  tags:
    - k8s-gpu
  rules:
    # Run on branch blonder
    - if: '$CI_COMMIT_BRANCH == "blonder"'

    # ALSO run in merge requests targeting blonder
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

release_sdist_310:
  image: gitlab-registry.cern.ch/blond/blond/python310
  stage: deploy
  extends:
    - .on_tag
  before_script:
    - python3 -m pip install --upgrade pip
    - python3 -m pip install build twine
    # Without an up-to-date setuptools, we don't get the requirements
    # inside the sdist.
    - python3 -m pip install -U setuptools
    - eval ${PRE_SDIST_BUILD}
  script:
    - cd ${project_root}
    - python3 -m build --sdist .
    - python3 -m twine upload --verbose
      --repository-url="${PYPI_UPLOAD_URL}"
      --username="${PYPI_USERNAME}"
      --password="${PYPI_PASSWORD}"
      dist/*.tar.gz

test_documentation_building:
  image: gitlab-registry.cern.ch/blond/blond/python314
  stage: doc_build
  interruptible: true
  extends:
    - .cache_uv
  script:
    - cd ${project_root}
    - *uv_setup
    - uv venv ./.venv
    - source ./.venv/bin/activate  # puts sphinx-build/sphinx-apidoc on PATH
    # xsuite + cupy are needed too: sphinx_autodoc_typehints imports the
    # guarded type hints, and with `-W` a missing module fails the build.
    # (The old pip --user install saw the copies baked into the CI image;
    # the uv venv is isolated from the system site-packages.)
    - uv pip install ${project_root}[doc,xsuite,gpu_cuda12]
    - cd ${project_root}/docs
    - . ./create_docs.sh
  artifacts:
    paths:
      - ${project_root}/docs/_build/html
    expire_in: 3 hour
    when: always


pages:
  image: gitlab-registry.cern.ch/blond/blond/python314
  extends:
    - .cache_uv
  script:
    - cd ${project_root}
    - mkdir public
    - *uv_setup
    - uv venv ./.venv
    - source ./.venv/bin/activate  # puts sphinx-build/sphinx-apidoc on PATH
    # xsuite + cupy are needed too: sphinx_autodoc_typehints imports the
    # guarded type hints, and with `-W` a missing module fails the build.
    # (The old pip --user install saw the copies baked into the CI image;
    # the uv venv is isolated from the system site-packages.)
    - uv pip install ${project_root}[doc,xsuite,gpu_cuda12]
    - cd ./docs
    - ./create_docs.sh
    - cd ..
    - cp -r docs/_build/html/* public/
  artifacts:
    paths:
      - ${project_root}public
  only:
    - blonder
