# Entry point only. The regular CI jobs live in `.gitlab/ci/main.yml`.
# Scheduled pipelines must not start them, because a schedule on `blonder`
# would otherwise run the full test matrix and redeploy the pages every time.
# Note: every pipeline schedule of this project only runs `stale_issues.yml`.
include:
  - local: .gitlab/ci/main.yml
    rules:
      - if: $CI_PIPELINE_SOURCE != "schedule"
  - local: .gitlab/ci/stale_issues.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "schedule"
