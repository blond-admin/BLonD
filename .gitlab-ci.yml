test_minimum:
  image: gitlab-registry.cern.ch/blond/blond/python310
  stage: test
  interruptible: true
  variables:
    BLOND_BACKEND_MODE: "numba"     # Set the basic backend to numba. It is most verbose about wrong types

  # Replace .before to use uv
  before_script:
    # Create venv to avoid permission error when installing packages
    - python3 -m venv .venv
    - . .venv/bin/activate
    # Install uv
    - python -m pip install uv
    - python -m uv pip install --resolution lowest-direct ${project_root}[all]
    - cd ${project_root}
    # Compile C++, CUDA, Fortran backends
    - python blond/core/backends/cpp/compile.py --parallel
    - python blond/core/backends/cuda/compile.py
    - python blond/core/backends/fortran/compile.py

  # Replace .main to use python from venv not python3 from system
  script:
    - pip list
    - cd ${project_root}
    # Run all unittests + the examples
    - python -m pytest
      -v unittests/
      --import-mode=importlib
  tags:
    - k8s-gpu


release_sdist_310:
  image: gitlab-registry.cern.ch/blond/blond/python310
  stage: deploy
  extends:
    - .on_tag
  before_script:
    - python3 -m pip install --upgrade pip
    - python3 -m pip install build twine
    # Without an up-to-date setuptools, we don't get the requirements.txt
    # inside the sdist.
    - python3 -m pip install -U setuptools
    - eval ${PRE_SDIST_BUILD}
  script:
    - cd ${project_root}
    - python3 -m build --sdist .
    - python3 -m twine upload --verbose
      --repository-url="${PYPI_UPLOAD_URL}"
      --username="${PYPI_USERNAME}"
      --password="${PYPI_PASSWORD}"
      dist/*.tar.gz


test_documentation_building:
  image: gitlab-registry.cern.ch/blond/blond/python310
  interruptible: true
  script:
    - cd ${project_root}
    - python3 -m pip install --upgrade pip
    - python3 -m pip install .[doc]
    - cd ${project_root}/docs
    - export PATH=/home/non_root/.local/bin:$PATH
    - . ./create_docs.sh
  artifacts:
    paths:
      - ${project_root}/docs/_build/html
    expire_in: 1 week
    when: always


pages:
  image: gitlab-registry.cern.ch/blond/blond/python310
  script:
    - cd ${project_root}
    - mkdir public
    - python3 -m pip install --upgrade pip
    - python3 -m pip install -v ${project_root}[doc]
    - export PATH=$HOME/.local/bin:$PATH
    - cd ./docs
    - ./create_docs.sh
    - cd ..
    - cp -r docs/_build/html/* public/
  artifacts:
    paths:
      - ${project_root}public
  only:
    - blonder
