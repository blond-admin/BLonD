variables:
  project_name: BLonD
  # Set the project root to the directory containing your setup.py
  project_root: ./
  PYPI_UPLOAD_URL: "https://upload.pypi.org/legacy/"
  # --- numba JIT cache (persisted across pipelines, see `.cache_numba`) ---
  # Centralise numba's on-disk cache (.nbi/.nbc) into one dir so GitLab can
  # cache it between runs; the kernels already use `cache=True`, but the
  # cache is otherwise cold on every fresh runner and recompiles during the
  # test run (the dominant cost).
  NUMBA_CACHE_DIR: "${CI_PROJECT_DIR}/.numba_cache"
  # Compile CPU-generic code so a cached entry is valid on ANY runner,
  # independent of its CPU. numba self-validates entries, so a mismatch only
  # ever forces a recompile (never wrong code); `generic` just maximises the
  # cross-runner hit rate. Remove these two if the runner pool is
  # CPU-homogeneous and you prefer full `-march=native` kernel speed.
  NUMBA_CPU_NAME: "generic"
  NUMBA_CPU_FEATURES: ""
stages:
  - precommit
  - doc_build
  - test_without_gpu
  - test_py314
  - test
  - deploy
default:
  interruptible: true

# Automatically cancel older running
# pipelines when a new one starts on the same branch
workflow:
  rules:
    - when: always
  auto_cancel:
    on_new_commit: interruptible

.cache_numba:
  # Persist numba's JIT cache between pipelines. The key is per-job, which
  # also separates Python versions (different image -> different numba/python
  # -> entries would not validate anyway). Safe to share across GPU and
  # non-GPU runners: it holds only CPU kernel code and self-validates on load.
  cache:
    - key: "numba-${CI_JOB_NAME}"
      paths:
        - .numba_cache/
  after_script:
    # Bound the cache size before GitLab uploads it (after_script runs just
    # before cache upload). Bare python3 + pure stdlib: no venv needed, and no
    # `import blond` -- which would recompile kernels into the very cache we
    # are pruning. Size budget: BLOND_NUMBA_CACHE_MAX_MB (default 500).
    - python3 dev_tools/prune_numba_cache.py

.on_tag:
  # Rules to run a job only on a git tagged commit
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success

.before:
  before_script:
    # Verify CUDA installation
    - nvidia-smi
    - gcc --version
    - nvcc --version # probe NVCC installation


    # Create and activate a virtual environment
    - python3 -m venv ./.venv
    - source ./.venv/bin/activate  # For Linux/macOS, use `source venv/bin/activate`

    # Install project with extras
    - python3 --version && gcc --version && mpirun --version
    - python3 -m pip install --upgrade pip
    - python3 -m pip install -v -e ${project_root}[all_cuda12]
    - cd ${project_root}
    # Compile C++, CUDA backends
    - python3 blond/core/backends/cpp/compile.py --parallel
    - python3 blond/core/backends/cuda/compile.py

.before_no_gpu:
  before_script:
    # Verify installation
    - gcc --version
    # Create and activate a virtual environment
    - python3 -m venv ./.venv
    - source ./.venv/bin/activate  # For Linux/macOS, use `source venv/bin/activate`
    # Install project with extras
    - python3 --version && gcc --version && mpirun --version
    - python3 -m pip install --upgrade pip
    - python3 -m pip install -v -e ${project_root}[all_no_cuda]
    - cd ${project_root}
    # Compile C++, CUDA backends
    - python3 blond/core/backends/cpp/compile.py --parallel

.main:
  variables:
    BLOND_BACKEND_MODE: "numba"     # Set the basic backend to numba. It is most verbose about wrong types
    BLOND_FORCE_TEST_ALL_BACKENDS: "True"     # Force backend scanning unittests to use all available backends
    MPLBACKEND: "Agg"     # Set the matplotlib backend to non-interactive. Test should run faster and MPI-test is not deadlocked.
  script:
    - source ./.venv/bin/activate  # For Linux/macOS, use `source venv/bin/activate`
    - pip list
    - cd ${project_root}
    # Run only MPI unittests. Only the main thread should report.
    # `-p no:randomly`: both ranks MUST run tests in identical order. Random
    # ordering can desync the ranks (one rank enters a collective while the
    # other does not), deadlocking on the unmatched MPI call. A fixed seed is
    # not enough: --cov on rank 0 alone perturbs the shuffle between ranks.
    - mpirun -n 2 bash -c 'if [ "$OMPI_COMM_WORLD_RANK" = "0" ]; then python3 -m pytest -v -m "mpi" -p no:randomly --cov --cov-config=.coveragerc; else python3 -m pytest -v -m "mpi" -p no:randomly; fi'
    # Run all unittests + the examples
    - pip uninstall -y mpi4py
    - python3 -m pytest
      -v
      --randomly-seed=$CI_PIPELINE_ID
      --cov-append
      --cov
      --cov-config=.coveragerc
      --cov-report html:coverage-html
      --cov-report xml:coverage.xml
      --junitxml=junit-report.xml
    - COV=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); rate = float(tree.getroot().attrib['line-rate']) * 100; print(rate)")
    - echo "XML_COVERAGE=$COV"
  # coverage: '/XML_COVERAGE=(\d+\.\d+)/'


.main_only_cupy:
  variables:
    BLOND_BACKEND_MODE: "cuda"     # Set the basic backend to CUDA.
    BLOND_FORCE_TEST_ALL_BACKENDS: "False"     # Force backend scanning unittests to use all available backends
    MPLBACKEND: "Agg"     # Set the matplotlib backend to non-interactive. Test should run faster and MPI-test is not deadlocked.
  script:
    - source ./.venv/bin/activate  # For Linux/macOS, use `source venv/bin/activate`
    - pip list
    - cd ${project_root}
    - python3 -m pytest
      -m "not backend_mutation and not mpi"
      -m "not backend_mutation"
      -v
      --randomly-seed=$CI_PIPELINE_ID

.main_no_gpu:
  variables:
    BLOND_BACKEND_MODE: "cpp"     # Set the basic backend to numba. It is most verbose about wrong types
    BLOND_FORCE_TEST_ALL_BACKENDS: "False"     # Force backend scanning unittests to use all available backends
    MPLBACKEND: "Agg"     # Set the matplotlib backend to non-interactive. Test should run faster and MPI-test is not deadlocked.
  script:
    - source ./.venv/bin/activate  # For Linux/macOS, use `source venv/bin/activate`
    - pip list
    - cd ${project_root}
    # Run only MPI unittests. Only the main thread should report.
    # `-p no:randomly`: both ranks MUST run tests in identical order, otherwise
    # they can desync on an MPI collective and deadlock (see .main for details).
    - mpirun -n 2 bash -c 'if [ "$OMPI_COMM_WORLD_RANK" = "0" ]; then python3 -m pytest -v -m "mpi" -p no:randomly; else python3 -m pytest -v -m "mpi" -p no:randomly; fi'
    # Run all unittests + the examples
    - pip uninstall -y mpi4py
    - pip uninstall -y cupy-cuda12x
    - python3 -m pytest
      -v
      --randomly-seed=$CI_PIPELINE_ID

.main_many_environments:
  variables:
    BLOND_BACKEND_MODE: "numba"     # Set the basic backend to numba. It is most verbose about wrong types
    BLOND_FORCE_TEST_ALL_BACKENDS: "True"     # Force backend scanning unittests to use all available backends
    MPLBACKEND: "Agg"     # Set the matplotlib backend to non-interactive. Test should run faster and MPI-test is not deadlocked.
  script:
    - source ./.venv/bin/activate  # For Linux/macOS, use `source venv/bin/activate`
    - pip list
    - cd ${project_root}
    - mkdir -p junit-reports
    # Run only MPI unittests. Only the main thread should report.
    # `-p no:randomly`: both ranks MUST run tests in identical order. Random
    # ordering can desync the ranks (one rank enters a collective while the
    # other does not), deadlocking on the unmatched MPI call. A fixed seed is
    # not enough: --cov on rank 0 alone perturbs the shuffle between ranks.
    - mpirun -n 2 bash -c 'if [ "$OMPI_COMM_WORLD_RANK" = "0" ]; then python3 -m pytest -v -m "mpi" -p no:randomly --cov --cov-config=.coveragerc; else python3 -m pytest -v -m "mpi" -p no:randomly; fi'
    # Run all unittests + the examples
    - pip uninstall -y mpi4py
    - python3 -m pytest
      -v
      --cov-append
      --cov
      --cov-config=.coveragerc
      --junitxml=junit-reports/junit-report-numba.xml
    - export BLOND_BACKEND_MODE="cuda"
    - python3 -m pytest
      -v
      -m "not mpi and not backend_mutation"
      --cov-append
      --cov
      --cov-config=.coveragerc
      --junitxml=junit-reports/junit-report-cuda.xml
    - export BLOND_BACKEND_MODE="numba"
    - pip uninstall -y cupy-cuda12x
    - export BLOND_FORCE_TEST_ALL_BACKENDS="False"
    - python3 -m pytest
      -v
      --randomly-seed=$CI_PIPELINE_ID
      --cov-append
      --cov
      --cov-config=.coveragerc
      --cov-report html:coverage-html
      --cov-report xml:coverage.xml
      --junitxml=junit-reports/junit-report-numba-without-cuda.xml
    - COV=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); rate = float(tree.getroot().attrib['line-rate']) * 100; print(rate)")
    - echo "XML_COVERAGE=$COV"
  coverage: '/XML_COVERAGE=(\d+\.\d+)/'


.publish:
  artifacts:
    expire_in: 30 days
    reports:
      # Enables https://docs.gitlab.com/ee/user/project/merge_requests/test_coverage_visualization.html
      coverage_report:
        coverage_format: cobertura
        path: ${project_root}coverage.xml
      # Enables https://docs.gitlab.com/ee/ci/unit_test_reports.html
      junit: ${project_root}junit-reports/junit-report-*.xml
    paths:
      - ${project_root}coverage-html/*
      - ${project_root}coverage.xml
      - ${project_root}junit-reports/junit-report-*.xml
    # reports:
    #   junit: ${project_root}/coverage-report.xml
    when: always

precommit-check:

  image: python:3.14 # See https://gitlab.cern.ch/blond/developer-tools/gitlab-ci-docker
  stage: precommit
  interruptible: true
  variables:
    SKIP: no-commit-to-branch
  before_script:
    - pip install pre-commit
  script:
    - pre-commit run --all-files
  cache:
    key: pre-commit-cache
    paths:
      - .cache/pre-commit

test_py_314_no_cupy:
  image: gitlab-registry.cern.ch/blond/blond/python314
  stage: test_without_gpu
  interruptible: true
  extends:
    - .before_no_gpu
    - .main_no_gpu
    - .cache_numba
  dependencies: []

test_py_314_main_many_environments:
  image: gitlab-registry.cern.ch/blond/blond/python314
  stage: test_py314
  interruptible: true
  extends:
    - .before
    - .main_many_environments
    - .publish
    - .cache_numba
  dependencies: []
  tags:
    - k8s-gpu

test_py_310:
  image: gitlab-registry.cern.ch/blond/blond/python310
  stage: test
  interruptible: true
  extends:
    - .before
    - .main
    # - .publish
  dependencies: []
  tags:
    - k8s-gpu
  rules:
    # Run on branch blonder
    - if: '$CI_COMMIT_BRANCH == "blonder"'

    # ALSO run in merge requests targeting blonder
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

