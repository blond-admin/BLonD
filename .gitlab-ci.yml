variables:
  project_name: BLonD
  # Set the project root to the directory containing your setup.py
  project_root: ./
  PYPI_UPLOAD_URL: "https://upload.pypi.org/legacy/"
stages:
  - precommit
  - doc_build
  - test_without_gpu
  - test_py310
  - test
  - deploy
default:
  interruptible: true

# Automatically cancel older running
# pipelines when a new one starts on the same branch
workflow:
  rules:
    - when: always
  auto_cancel:
    on_new_commit: interruptible

.on_tag:
  # Rules to run a job only on a git tagged commit
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success

.before:
  before_script:
    # Verify CUDA installation
    - nvidia-smi
    - gcc --version
    - nvcc --version # probe NVCC installation


    # Create and activate a virtual environment
    - python3 -m venv ./.venv
    - source ./.venv/bin/activate  # For Linux/macOS, use `source venv/bin/activate`

    # Install project with extras
    - python3 --version && gcc --version && mpirun --version
    - python3 -m pip install --upgrade pip
    - python3 -m pip install -v -e ${project_root}[all_cuda12]
    - cd ${project_root}
    # Compile C++, CUDA backends
    - python3 blond/core/backends/cpp/compile.py --parallel
    - python3 blond/core/backends/cuda/compile.py

.before_no_gpu:
  before_script:
    # Verify installation
    - gcc --version
    # Create and activate a virtual environment
    - python3 -m venv ./.venv
    - source ./.venv/bin/activate  # For Linux/macOS, use `source venv/bin/activate`
    # Install project with extras
    - python3 --version && gcc --version && mpirun --version
    - python3 -m pip install --upgrade pip
    - python3 -m pip install -v -e ${project_root}[all_no_cuda]
    - cd ${project_root}
    # Compile C++, CUDA backends
    - python3 blond/core/backends/cpp/compile.py --parallel

.main:
  variables:
    BLOND_BACKEND_MODE: "numba"     # Set the basic backend to numba. It is most verbose about wrong types
    BLOND_FORCE_TEST_ALL_BACKENDS: "True"     # Force backend scanning unittests to use all available backends
    MPLBACKEND: "Agg"     # Set the matplotlib backend to non-interactive. Test should run faster and MPI-test is not deadlocked.
  script:
    - source ./.venv/bin/activate  # For Linux/macOS, use `source venv/bin/activate`
    - pip list
    - cd ${project_root}
    # Run only MPI unittests. Only the main thread should report.
    - mpirun -n 2 bash -c 'if [ "$OMPI_COMM_WORLD_RANK" = "0" ]; then python3 -m pytest -v unittests/ -m "mpi" --randomly-seed=0 --cov --cov-config=.coveragerc; else python3 -m pytest -v unittests/ -m "mpi" --randomly-seed=0; fi'
    # Run all unittests + the examples
    - pip uninstall -y mpi4py
    - python3 -m pytest
      -v unittests/
      --randomly-seed=$CI_PIPELINE_ID
      --cov-append
      --cov
      --cov-config=.coveragerc
      --cov-report html:coverage-html
      --cov-report xml:coverage.xml
      --junitxml=junit-report.xml
    - COV=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); rate = float(tree.getroot().attrib['line-rate']) * 100; print(rate)")
    - echo "XML_COVERAGE=$COV"
  # coverage: '/XML_COVERAGE=(\d+\.\d+)/'


.main_only_cupy:
  variables:
    BLOND_BACKEND_MODE: "cuda"     # Set the basic backend to CUDA.
    BLOND_FORCE_TEST_ALL_BACKENDS: "False"     # Force backend scanning unittests to use all available backends
    MPLBACKEND: "Agg"     # Set the matplotlib backend to non-interactive. Test should run faster and MPI-test is not deadlocked.
  script:
    - source ./.venv/bin/activate  # For Linux/macOS, use `source venv/bin/activate`
    - pip list
    - cd ${project_root}
    - python3 -m pytest
      -m "not backend_mutation and not mpi"
      -m "not backend_mutation"
      -v unittests/
      --randomly-seed=$CI_PIPELINE_ID

.main_no_gpu:
  variables:
    BLOND_BACKEND_MODE: "cpp"     # Set the basic backend to numba. It is most verbose about wrong types
    BLOND_FORCE_TEST_ALL_BACKENDS: "False"     # Force backend scanning unittests to use all available backends
    MPLBACKEND: "Agg"     # Set the matplotlib backend to non-interactive. Test should run faster and MPI-test is not deadlocked.
  script:
    - source ./.venv/bin/activate  # For Linux/macOS, use `source venv/bin/activate`
    - pip list
    - cd ${project_root}
    # Run only MPI unittests. Only the main thread should report.
    - mpirun -n 2 bash -c 'if [ "$OMPI_COMM_WORLD_RANK" = "0" ]; then python3 -m pytest -v unittests/ -m "mpi" --randomly-seed=0; else python3 -m pytest -v unittests/ -m "mpi" --randomly-seed=0; fi'
    # Run all unittests + the examples
    - pip uninstall -y mpi4py
    - pip uninstall -y cupy-cuda12x
    - python3 -m pytest
      -v unittests/
      --randomly-seed=$CI_PIPELINE_ID

.main_many_environments:
  variables:
    BLOND_BACKEND_MODE: "numba"     # Set the basic backend to numba. It is most verbose about wrong types
    BLOND_FORCE_TEST_ALL_BACKENDS: "True"     # Force backend scanning unittests to use all available backends
    MPLBACKEND: "Agg"     # Set the matplotlib backend to non-interactive. Test should run faster and MPI-test is not deadlocked.
  script:
    - source ./.venv/bin/activate  # For Linux/macOS, use `source venv/bin/activate`
    - pip list
    - cd ${project_root}
    # Run only MPI unittests. Only the main thread should report.
    - mpirun -n 2 bash -c 'if [ "$OMPI_COMM_WORLD_RANK" = "0" ]; then python3 -m pytest -v unittests/ -m "mpi" --randomly-seed=0 --cov --cov-config=.coveragerc; else python3 -m pytest -v unittests/ -m "mpi" --randomly-seed=0; fi'
    # Run all unittests + the examples
    - pip uninstall -y mpi4py
    - python3 -m pytest
      -v unittests/
      --cov-append
      --cov
      --cov-config=.coveragerc
    - export BLOND_BACKEND_MODE="cuda"
    - python3 -m pytest
      -v unittests/
      -m "not mpi and not backend_mutation"
      --cov-append
      --cov
      --cov-config=.coveragerc
    - export BLOND_BACKEND_MODE="numba"
    - pip uninstall -y cupy-cuda12x
    - export BLOND_FORCE_TEST_ALL_BACKENDS="False"
    - python3 -m pytest
      -v unittests/
      --randomly-seed=$CI_PIPELINE_ID
      --cov-append
      --cov
      --cov-config=.coveragerc
      --cov-report html:coverage-html
      --cov-report xml:coverage.xml
      --junitxml=junit-report.xml
    - COV=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); rate = float(tree.getroot().attrib['line-rate']) * 100; print(rate)")
    - echo "XML_COVERAGE=$COV"
  coverage: '/XML_COVERAGE=(\d+\.\d+)/'


.publish:
  artifacts:
    expire_in: 30 days
    reports:
      # Enables https://docs.gitlab.com/ee/user/project/merge_requests/test_coverage_visualization.html
      coverage_report:
        coverage_format: cobertura
        path: ${project_root}coverage.xml
      # Enables https://docs.gitlab.com/ee/ci/unit_test_reports.html
      junit: ${project_root}junit-report.xml
    paths:
      - ${project_root}coverage-html/*
      - ${project_root}coverage.xml
      - ${project_root}junit-report.xml
    # reports:
    #   junit: ${project_root}/coverage-report.xml
    when: always

precommit-check:

  image: python:3.12 # See https://gitlab.cern.ch/blond/developer-tools/gitlab-ci-docker
  stage: precommit
  interruptible: true
  before_script:
    - pip install pre-commit
  script:
    - pre-commit run --all-files
  cache:
    key: pre-commit-cache
    paths:
      - .cache/pre-commit

test_py_310_no_cupy:
  image: gitlab-registry.cern.ch/blond/blond/python310
  stage: test_without_gpu
  interruptible: true
  extends:
    - .before_no_gpu
    - .main_no_gpu
  dependencies: []

test_py_310_main_many_environments:
  image: gitlab-registry.cern.ch/blond/blond/python310
  stage: test_py310
  interruptible: true
  extends:
    - .before
    - .main_many_environments
    - .publish
  dependencies: []
  tags:
    - k8s-gpu

test_py_311:
  image: gitlab-registry.cern.ch/blond/blond/python311
  stage: test
  interruptible: true
  extends:
    - .before
    - .main
    # - .publish
  dependencies: []
  tags:
    - k8s-gpu
  rules:
    # Run on branch blonder
    - if: '$CI_COMMIT_BRANCH == "blonder"'

    # ALSO run in merge requests targeting blonder
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

